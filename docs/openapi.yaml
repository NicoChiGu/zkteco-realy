openapi: 3.0.3
info:
  title: ZKTeco Relay API
  version: 1.2.0
  description: |
    Windows ZKTeco 脱机通讯 REST/WebSocket 中继服务。
    除健康检查和文档端点外，所有请求均需提供 X-API-Key。
servers:
  - url: http://127.0.0.1:5080
    description: 默认本机服务
tags:
  - name: Service
    description: 健康检查与 API 文档
  - name: Devices
    description: 设备会话、连接和控制
  - name: Attendance
    description: 考勤读取、查询和清理
  - name: Configurations
    description: 设备连接配置持久化
  - name: Users
    description: 人员、卡号和密码
  - name: Biometrics
    description: 指纹、人脸模板和照片
  - name: Access
    description: 门禁控制与权限
  - name: Events
    description: 实时事件 WebSocket
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      tags: [Service]
      operationId: healthCheck
      summary: Readiness 健康检查
      security: []
      responses:
        '200':
          description: COM、SQLite、事件库和 STA 工作线程可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayHealthReport'
        '503':
          description: 至少一个核心组件不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayHealthReport'
  /health/live:
    get:
      tags: [Service]
      operationId: livenessCheck
      summary: 仅检查 Relay 进程存活
      security: []
      responses:
        '200':
          description: 进程存活
  /health/ready:
    get:
      tags: [Service]
      operationId: readinessCheck
      summary: Readiness 健康检查
      security: []
      responses:
        '200':
          description: 核心组件可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayHealthReport'
        '503':
          description: 核心组件不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayHealthReport'
  /docs:
    get:
      tags: [Service]
      operationId: openSwaggerUi
      summary: Swagger UI
      security: []
      responses:
        '200':
          description: Swagger UI HTML
          content:
            text/html:
              schema:
                type: string
  /openapi.yaml:
    get:
      tags: [Service]
      operationId: downloadOpenApi
      summary: 下载 OpenAPI 3.0 定义
      security: []
      responses:
        '200':
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/version:
    get:
      tags: [Service]
      operationId: getRelayVersion
      summary: 获取 Relay 程序和协议版本
      responses:
        '200':
          description: Relay 版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/capabilities:
    get:
      tags: [Service]
      operationId: getRelayCapabilities
      summary: 获取 Relay 全局协议能力
      responses:
        '200':
          description: 全局能力列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayCapabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/diagnostics/health:
    get:
      tags: [Service]
      operationId: getRelayHealthDiagnostics
      summary: 获取经鉴权的分项健康诊断
      responses:
        '200':
          description: 核心组件可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayHealthReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: 核心组件不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayHealthReport'
  /api/v1/devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: 获取设备会话列表
      responses:
        '200':
          description: 设备状态列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      operationId: getDevice
      summary: 获取单个设备状态
      responses:
        '200':
          description: 设备状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
  /api/v1/devices/{deviceId}/connect:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Devices]
      operationId: connectDevice
      summary: 连接设备
      description: 连接成功或失败都会保存连接配置；成功后启用自动连接。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectDeviceRequest'
            example:
              ipAddress: 192.168.1.100
              port: 4370
              communicationPassword: ''
      responses:
        '200':
          description: 连接成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceConnectionResult'
        '400':
          description: 请求参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DeviceUnavailable'
        '502':
          $ref: '#/components/responses/DeviceOperationFailed'
  /api/v1/devices/{deviceId}/disconnect:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Devices]
      operationId: disconnectDevice
      summary: 断开设备并关闭自动连接
      responses:
        '200':
          description: 已断开
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisconnectResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
  /api/v1/devices/{deviceId}/restart:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Devices]
      operationId: restartDevice
      summary: 重启设备
      responses:
        '202':
          description: 重启命令已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestartResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DeviceUnavailable'
  /api/v1/devices/{deviceId}/attendance:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Attendance]
      operationId: readAllAttendance
      summary: 拉取全部普通考勤记录
      description: 兼容端点，响应体保持为数组。
      responses:
        '200':
          description: 考勤记录
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DeviceUnavailable'
  /api/v1/devices/{deviceId}/attendance/query:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - name: from
        in: query
        description: 包含该时刻，可单独使用。
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: 包含该时刻，可单独使用。
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
    get:
      tags: [Attendance]
      operationId: queryAttendance
      summary: 按时间范围查询并分页
      description: |
        同时提供 from 和 to 时优先使用 ReadTimeGLogData；旧固件不支持时，
        回退到 ReadAllGLogData 后本地过滤。分页发生在设备读取完成之后。
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendancePage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DeviceUnavailable'
  /api/v1/devices/{deviceId}/attendance/clear:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Attendance]
      operationId: clearAttendance
      summary: 清除考勤记录
      description: |
        不传时间为全量清除；from 与 to 同时存在时清除该范围；
        before 存在时清除该时刻之前的记录。confirm 必须为 true。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceClearRequest'
            examples:
              all:
                summary: 清除全部
                value:
                  confirm: true
              range:
                summary: 清除时间范围
                value:
                  confirm: true
                  from: '2026-07-01T00:00:00+08:00'
                  to: '2026-07-31T23:59:59+08:00'
              before:
                summary: 清除指定时刻之前
                value:
                  confirm: true
                  before: '2026-07-01T00:00:00+08:00'
      responses:
        '200':
          description: 清理成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '400':
          $ref: '#/components/responses/InvalidOrVendorFailure'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DeviceUnavailable'
  /api/v1/device-configurations:
    get:
      tags: [Configurations]
      operationId: listDeviceConfigurations
      summary: 获取全部持久化设备配置
      responses:
        '200':
          description: 配置列表，不包含通信密码明文
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/device-configurations/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Configurations]
      operationId: getDeviceConfiguration
      summary: 获取单个持久化设备配置
      responses:
        '200':
          description: 设备配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ConfigurationNotFound'
    put:
      tags: [Configurations]
      operationId: upsertDeviceConfiguration
      summary: 新建或更新持久化设备配置
      description: communicationPassword 为 null 时保留已有密码。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceConfigurationRequest'
      responses:
        '200':
          description: 更新后的配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceConfiguration'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Configurations]
      operationId: deleteDeviceConfiguration
      summary: 删除持久化设备配置
      responses:
        '204':
          description: 已删除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ConfigurationNotFound'
  /api/v1/devices/{deviceId}/users:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Users]
      operationId: listUsers
      summary: 获取人员列表
      responses:
        '200':
          description: 人员列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DeviceUnavailable'
        '502':
          $ref: '#/components/responses/DeviceOperationFailed'
  /api/v1/devices/{deviceId}/users/{enrollNumber}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/EnrollNumber'
    get:
      tags: [Users]
      operationId: getUser
      summary: 获取人员
      responses:
        '200':
          description: 人员信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DeviceOperationFailed'
    put:
      tags: [Users]
      operationId: upsertUser
      summary: 新建或更新人员、卡号和密码
      description: password 或 cardNumber 为 null 时保留设备中的已有值。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertUserRequest'
      responses:
        '200':
          $ref: '#/components/responses/OperationSucceeded'
        '400':
          $ref: '#/components/responses/InvalidOrVendorFailure'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DeviceOperationFailed'
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: 删除人员及登记数据
      responses:
        '200':
          $ref: '#/components/responses/OperationSucceeded'
        '400':
          $ref: '#/components/responses/VendorFailure'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DeviceOperationFailed'
  /api/v1/devices/{deviceId}/users/{enrollNumber}/fingerprints/{fingerIndex}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/EnrollNumber'
      - $ref: '#/components/parameters/FingerIndex'
    get:
      tags: [Biometrics]
      operationId: getFingerprint
      summary: 获取指纹模板
      responses:
        '200':
          description: 指纹模板
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FingerprintTemplateResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DeviceOperationFailed'
    put:
      tags: [Biometrics]
      operationId: setFingerprint
      summary: 写入指纹模板
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FingerprintTemplateRequest'
      responses:
        '200':
          $ref: '#/components/responses/OperationSucceeded'
        '400':
          $ref: '#/components/responses/InvalidOrVendorFailure'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DeviceOperationFailed'
    delete:
      tags: [Biometrics]
      operationId: deleteFingerprint
      summary: 删除指纹模板
      responses:
        '200':
          $ref: '#/components/responses/OperationSucceeded'
        '400':
          $ref: '#/components/responses/VendorFailure'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DeviceOperationFailed'
  /api/v1/devices/{deviceId}/users/{enrollNumber}/face:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/EnrollNumber'
    get:
      tags: [Biometrics]
      operationId: getFace
      summary: 获取人脸模板
      parameters:
        - $ref: '#/components/parameters/FaceIndex'
      responses:
        '200':
          description: 人脸模板
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceTemplateResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DeviceOperationFailed'
    put:
      tags: [Biometrics]
      operationId: setFace
      summary: 写入人脸模板
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceTemplateRequest'
      responses:
        '200':
          $ref: '#/components/responses/OperationSucceeded'
        '400':
          $ref: '#/components/responses/InvalidOrVendorFailure'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DeviceOperationFailed'
    delete:
      tags: [Biometrics]
      operationId: deleteFace
      summary: 删除人脸模板
      parameters:
        - $ref: '#/components/parameters/FaceIndex'
      responses:
        '200':
          $ref: '#/components/responses/OperationSucceeded'
        '400':
          $ref: '#/components/responses/VendorFailure'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DeviceOperationFailed'
  /api/v1/devices/{deviceId}/users/{enrollNumber}/photo:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/EnrollNumber'
    get:
      tags: [Biometrics]
      operationId: downloadUserPhoto
      summary: 下载设备原始 JPG 用户照片
      description: 返回设备保存的原始照片，不是人脸算法模板；Relay 不持久化照片。
      responses:
        '200':
          description: 用户 JPG 照片
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPhotoResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DeviceUnavailable'
        '422':
          $ref: '#/components/responses/CapabilityNotSupported'
        '502':
          $ref: '#/components/responses/DeviceOperationFailed'
    put:
      tags: [Biometrics]
      operationId: uploadUserPhoto
      summary: 上传人员照片或可见光人脸照片
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPhotoRequest'
      responses:
        '200':
          $ref: '#/components/responses/OperationSucceeded'
        '400':
          $ref: '#/components/responses/InvalidOrVendorFailure'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DeviceUnavailable'
        '422':
          $ref: '#/components/responses/CapabilityNotSupported'
        '502':
          $ref: '#/components/responses/DeviceOperationFailed'
  /api/v1/devices/{deviceId}/users/{enrollNumber}/visible-light-face-photo:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/EnrollNumber'
    get:
      tags: [Biometrics]
      operationId: downloadVisibleLightFacePhoto
      summary: 下载设备可见光人脸比对照片
      description: >-
        按设备约定的 verify_biophoto_9_{enrollNumber}.jpg 文件名读取比对照片；
        不是人脸算法模板，Relay 不持久化照片。
      responses:
        '200':
          description: 可见光人脸 JPG 照片
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPhotoResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 设备不存在，或目标人员没有可见光人脸照片
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/DeviceUnavailable'
        '422':
          $ref: '#/components/responses/CapabilityNotSupported'
        '502':
          $ref: '#/components/responses/DeviceOperationFailed'
  /api/v1/devices/{deviceId}/capabilities:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Access]
      operationId: getDeviceCapabilities
      summary: 探测设备门禁和人员 ID 能力
      responses:
        '200':
          description: 分项设备能力；未知项通过 null 和 probeErrors 表示。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCapabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DeviceUnavailable'
        '502':
          $ref: '#/components/responses/DeviceOperationFailed'
  /api/v1/devices/{deviceId}/access/door-state:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Access]
      operationId: getDoorState
      summary: 获取当前门状态
      responses:
        '200':
          description: 门状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoorStateResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DeviceUnavailable'
        '502':
          $ref: '#/components/responses/DeviceOperationFailed'
  /api/v1/devices/{deviceId}/access/normally-open/start:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Access]
      operationId: startNormallyOpen
      summary: 开始常开
      description: 仅适用于 GetACFun=14 的设备，并返回常开前锁驱动时长。
      responses:
        '200':
