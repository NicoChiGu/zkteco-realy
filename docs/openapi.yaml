  /api/v1/events/ws:
    get:
      tags: [Events]
      operationId: subscribeRealtimeEvents
      summary: 订阅实时事件 WebSocket
      description: |
        使用 WebSocket 升级连接。服务端客户端应使用 X-API-Key；
        浏览器可使用 apiKey 查询参数。可按 deviceId 和 eventType 过滤。
        afterSequence 用于从 SQLite 按序补发后继续实时推送。
      x-websocket: true
      x-websocket-message-schema:
        $ref: '#/components/schemas/RealtimeEvent'
      security:
        - ApiKeyAuth: []
        - ApiKeyQuery: []
      parameters:
        - name: apiKey
          in: query
          description: 浏览器 WebSocket 无法设置自定义请求头时使用。
          schema:
            type: string
        - name: deviceId
          in: query
          schema:
            type: string
        - name: eventType
          in: query
          description: 逗号分隔的事件类型。
          schema:
            type: string
          example: attendance,door,alarm
        - name: afterSequence
          in: query
          description: 已提交的最后一个事件序号，使用十进制字符串。
          schema:
            type: string
            pattern: '^[0-9]+$'
          example: '1024'
      responses:
        '101':
          description: WebSocket 协议升级成功，消息模型为 RealtimeEvent。
        '400':
          description: 请求不是 WebSocket 升级请求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    ApiKeyQuery:
      type: apiKey
      in: query
      name: apiKey
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: 调用方定义的稳定设备标识，最长 64 个字符。
      schema:
        type: string
        maxLength: 64
      example: office-gate-01
    EnrollNumber:
      name: enrollNumber
      in: path
      required: true
      description: 设备中的人员工号。
      schema:
        type: string
      example: '10001'
    FingerIndex:
      name: fingerIndex
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 9
    FaceIndex:
      name: faceIndex
      in: query
      required: false
      schema:
        type: integer
        default: 50
    TimeZoneIndex:
      name: index
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    GroupNumber:
      name: groupNumber
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CombinationNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Unauthorized:
      description: 缺少或提供了错误的 API Key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidRequest:
      description: 请求参数无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidOrVendorFailure:
      description: 请求参数无效或厂商 SDK 拒绝操作
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ApiError'
              - $ref: '#/components/schemas/OperationResult'
    VendorFailure:
      description: 厂商 SDK 拒绝操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationResult'
    DeviceNotFound:
      description: 设备会话不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: device_not_found
            message: Device was not found.
            vendorErrorCode: null
    ConfigurationNotFound:
      description: 持久化配置不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DeviceUnavailable:
      description: 设备会话存在但尚未连接
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    CapabilityNotSupported:
      description: 当前固件或 SDK 不支持该能力
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DeviceOperationFailed:
      description: 厂商 SDK 操作失败或返回无效数据
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    OperationSucceeded:
      description: 设备操作成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationResult'
  schemas:
    RelayVersion:
      type: object
      required: [product, version, apiVersion, protocolVersion]
      properties:
        product:
          type: string
          enum: [zkteco-relay]
        version:
          type: string
          example: 1.2.0
        apiVersion:
          type: string
          enum: [v1]
        protocolVersion:
          type: integer
          enum: [1]
    RelayCapabilities:
      type: object
      required: [protocolVersion, features]
      properties:
        protocolVersion:
          type: integer
          enum: [1]
        features:
          type: array
          uniqueItems: true
          items:
            type: string
          example:
            - user-photo-download
            - visible-light-face-photo-download
            - device-capability-probe
            - door-state
            - normally-open
            - event-replay
    RelayHealthReport:
      type: object
      required: [healthy, checkedAt, components]
      properties:
        healthy:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        components:
          type: object
          additionalProperties:
            type: object
            required: [healthy, message, checkedAt]
            properties:
              healthy:
                type: boolean
              message:
                type: string
              checkedAt:
                type: string
                format: date-time
              details:
                type: object
                nullable: true
                additionalProperties: true
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        vendorErrorCode:
          type: integer
          nullable: true
    OperationResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        vendorErrorCode:
          type: integer
          nullable: true
        message:
          type: string
          nullable: true
    ConnectDeviceRequest:
      type: object
      required: [ipAddress]
      properties:
        ipAddress:
          type: string
          description: 设备 IPv4 或 IPv6 地址。
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 4370
        communicationPassword:
          type: string
          nullable: true
          description: 设备通信密码，不是 Relay API Key。
    UpdateDeviceConfigurationRequest:
      allOf:
        - $ref: '#/components/schemas/ConnectDeviceRequest'
        - type: object
          properties:
            autoConnect:
              type: boolean
              default: true
    DeviceConnectionResult:
      type: object
      required: [deviceId, connected]
      properties:
        deviceId:
          type: string
        connected:
          type: boolean
        error:
          type: string
          nullable: true
        vendorErrorCode:
          type: integer
          nullable: true
    DeviceStatus:
      type: object
      required: [deviceId, ipAddress, port, connected]
      properties:
        deviceId:
          type: string
        ipAddress:
          type: string
        port:
          type: integer
        connected:
          type: boolean
        connectedAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
        lastCommunicationAt:
          type: string
          format: date-time
          nullable: true
        disconnectedAt:
          type: string
          format: date-time
          nullable: true
        reconnectAttempt:
          type: integer
          nullable: true
        nextReconnectAt:
          type: string
          format: date-time
          nullable: true
    DeviceConfiguration:
      type: object
      required:
        - deviceId
        - ipAddress
        - port
        - hasCommunicationPassword
        - autoConnect
        - updatedAt
      properties:
        deviceId:
          type: string
        ipAddress:
          type: string
        port:
          type: integer
        hasCommunicationPassword:
          type: boolean
        autoConnect:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    DisconnectResult:
      type: object
      required: [deviceId, connected]
      properties:
        deviceId:
          type: string
        connected:
          type: boolean
          enum: [false]
    RestartResult:
      type: object
      required: [deviceId, restarted]
      properties:
        deviceId:
          type: string
        restarted:
          type: boolean
    AttendanceRecord:
      type: object
      required: [enrollNumber, verifyMode, inOutMode, timestamp, workCode]
      properties:
        enrollNumber:
          type: string
        verifyMode:
          type: integer
          description: 厂商 SDK 原始验证方式。
        inOutMode:
          type: integer
          description: 厂商 SDK 原始考勤状态。
        timestamp:
          type: string
          format: date-time
        workCode:
          type: integer
    AttendancePage:
      type: object
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecord'
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
    AttendanceClearRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          enum: [true]
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
        before:
          type: string
          format: date-time
          nullable: true
      description: |
        before 不能与 from/to 混用；from 和 to 必须同时存在。
        三个时间均为空时表示清除全部。
    UserInfo:
      type: object
      required: [enrollNumber, name, privilege, enabled, cardNumber, hasPassword]
      properties:
        enrollNumber:
          type: string
        name:
          type: string
        privilege:
          type: integer
        enabled:
          type: boolean
        cardNumber:
          type: string
        hasPassword:
          type: boolean
    UpsertUserRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        password:
          type: string
          nullable: true
        privilege:
          type: integer
          default: 0
        enabled:
          type: boolean
          default: true
        cardNumber:
          type: string
          nullable: true
    FingerprintTemplateRequest:
      type: object
      required: [templateData]
      properties:
        fingerIndex:
          type: integer
          description: 路径参数会覆盖该值。
        templateData:
          type: string
    FingerprintTemplateResult:
      type: object
      required: [enrollNumber, fingerIndex, templateData, templateLength]
      properties:
        enrollNumber:
          type: string
        fingerIndex:
          type: integer
        templateData:
          type: string
        templateLength:
          type: integer
    FaceTemplateRequest:
      type: object
      required: [templateData]
      properties:
        templateData:
          type: string
        faceIndex:
          type: integer
          default: 50
    FaceTemplateResult:
      type: object
      required: [enrollNumber, faceIndex, templateData, templateLength]
      properties:
        enrollNumber:
          type: string
        faceIndex:
          type: integer
        templateData:
          type: string
        templateLength:
          type: integer
    UserPhotoRequest:
      type: object
      required: [base64Jpeg]
      properties:
        base64Jpeg:
          type: string
          format: byte
        visibleLightFacePhoto:
          type: boolean
          default: false
    UserPhotoResult:
      type: object
      required: [enrollNumber, fileName, base64Jpeg, byteLength]
      properties:
        enrollNumber:
          type: string
        fileName:
          type: string
          pattern: '^(?:[A-Za-z0-9_-]+|verify_biophoto_9_[A-Za-z0-9_-]+)\.jpg$'
        base64Jpeg:
          type: string
          format: byte
        byteLength:
          type: integer
          minimum: 4
          maximum: 10485760
    DeviceCapabilities:
      type: object
      required:
        - supportsAdvancedAccess
        - supportsNormallyOpen
        - supportsDoorState
        - supportsUserPhotoDownload
        - supportsVisibleLightFacePhotoDownload
        - supportsAttendanceRangeQuery
        - probeErrors
      properties:
        pinWidth:
          type: integer
          nullable: true
        supportsAlphabeticPin:
          type: boolean
          nullable: true
        accessControlFunction:
          type: integer
          nullable: true
          description: GetACFun 原始值；14 表示高级门禁和常开。
        supportsAdvancedAccess:
          type: boolean
        supportsNormallyOpen:
          type: boolean
        supportsDoorState:
          type: boolean
        supportsUserPhotoDownload:
          type: boolean
          nullable: true
          description: null 表示当前 SDK 无法完成 IsNewFirmwareMachine 探测。
        supportsVisibleLightFacePhotoDownload:
          type: boolean
          nullable: true
          description: >-
            null 表示固件探测未知；实际下载还要求当前 SDK 注册包含
            GetUserFacePhotoByName。
        supportsAttendanceRangeQuery:
          type: boolean
        probeErrors:
          type: array
          items:
            type: string
    DoorStateResult:
      type: object
      required: [open, rawState]
      properties:
        open:
          type: boolean
        rawState:
          type: integer
    EndNormallyOpenRequest:
      type: object
      required: [restoreLockDriveTime]
      properties:
        restoreLockDriveTime:
          type: integer
          minimum: 0
          maximum: 254
    DoorModeResult:
      type: object
      required: [normallyOpen, lockDriveTime]
      properties:
        normallyOpen:
          type: boolean
        lockDriveTime:
          type: integer
          minimum: 0
          maximum: 255
        previousLockDriveTime:
          type: integer
          nullable: true
        doorOpen:
          type: boolean
          nullable: true
    DoorUnlockRequest:
      type: object
      properties:
        delayTenthsOfSecond:
          type: integer
          default: 30
          description: 开门延时，单位为 0.1 秒。
    TimeZoneRequest:
      type: object
      required: [schedule]
      properties:
        timeZoneIndex:
          type: integer
          description: 路径参数会覆盖该值。
        schedule:
          type: string
          minLength: 56
          maxLength: 56
          pattern: '^[0-9]{56}$'
    TimeZoneInfo:
      type: object
      required: [timeZoneIndex, schedule]
      properties:
        timeZoneIndex:
          type: integer
        schedule:
          type: string
    AccessGroupRequest:
      type: object
      required: [timeZone1, timeZone2, timeZone3]
      properties:
        groupNumber:
          type: integer
          description: 路径参数会覆盖该值。
        timeZone1:
          type: integer
        timeZone2:
          type: integer
        timeZone3:
          type: integer
        holidayValid:
          type: boolean
          default: false
        verifyStyle:
          type: integer
          default: 0
    AccessGroupInfo:
      allOf:
        - $ref: '#/components/schemas/AccessGroupRequest'
        - type: object
          required: [groupNumber]
    UserAccessRequest:
      type: object
      required: [groupNumber]
      properties:
        groupNumber:
          type: integer
        timeZone1:
          type: integer
          default: 0
        timeZone2:
          type: integer
          default: 0
        timeZone3:
          type: integer
          default: 0
        useGroupTimeZone:
          type: boolean
          default: true
    UserAccessInfo:
      type: object
      required: [enrollNumber, groupNumber, timeZones, usesGroupTimeZone]
      properties:
        enrollNumber:
          type: string
        groupNumber:
          type: integer
        timeZones:
          type: string
        usesGroupTimeZone:
          type: boolean
    UnlockCombinationRequest:
      type: object
      required: [group1]
      properties:
        combinationNumber:
          type: integer
          description: 路径参数会覆盖该值。
        group1:
          type: integer
        group2:
          type: integer
          default: 0
        group3:
          type: integer
          default: 0
        group4:
          type: integer
          default: 0
        group5:
          type: integer
          default: 0
    UnlockCombinationInfo:
      allOf:
        - $ref: '#/components/schemas/UnlockCombinationRequest'
        - type: object
          required: [combinationNumber]
    RealtimeEvent:
      type: object
      required: [eventId, deviceId, eventType, occurredAt, data]
      properties:
        eventId:
          type: string
        eventSequence:
          type: string
          nullable: true
