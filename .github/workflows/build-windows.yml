name: Build and release Windows executables

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.runtime }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            platform: x64
            sdk_script: install-sdk-x64.ps1
            test_dotnet: dotnet
          - runtime: win-x86
            platform: x86
            sdk_script: install-sdk-x86.ps1
            test_dotnet: .\.dotnet-x86\dotnet.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup x86 .NET test runtime
        if: matrix.platform == 'x86'
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile .\dotnet-install.ps1
          .\dotnet-install.ps1 -Channel 8.0 -Architecture x86 -InstallDir .\.dotnet-x86 -NoPath

      - name: Resolve application version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tagVersion = "${{ github.ref_name }}".TrimStart('v', 'V')
          } else {
            $tagVersion = "0.0.0"
          }
          $version = ($tagVersion -split '[-+]')[0]
          try {
            [void][Version]$version
          } catch {
            throw "Tag must use a numeric version such as v1.2.3: $tagVersion"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Application version: $version"

      - name: Restore API
        run: dotnet restore .\ZktecoRelay.csproj -r ${{ matrix.runtime }}

      - name: Restore manager
        run: dotnet restore .\Manager\ZktecoRelay.Manager.csproj -r ${{ matrix.runtime }}

      - name: Restore tests
        shell: pwsh
        run: |
          & "${{ matrix.test_dotnet }}" restore `
            .\tests\ZktecoRelay.Tests\ZktecoRelay.Tests.csproj `
            -p:PlatformTarget=${{ matrix.platform }}

      - name: Test Relay
        shell: pwsh
        run: |
          & "${{ matrix.test_dotnet }}" test `
            .\tests\ZktecoRelay.Tests\ZktecoRelay.Tests.csproj `
            -c Release `
            --no-restore `
            -p:PlatformTarget=${{ matrix.platform }}

      - name: Publish API executable
        shell: pwsh
        run: |
          dotnet publish .\ZktecoRelay.csproj `
            -c Release `
            -r ${{ matrix.runtime }} `
            --self-contained true `
            --no-restore `
            -p:Version=$env:APP_VERSION `
            -p:FileVersion=$env:APP_VERSION `
            -p:AssemblyVersion=$env:APP_VERSION `
            -p:PlatformTarget=${{ matrix.platform }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\artifacts\${{ matrix.runtime }}\api

      - name: Publish graphical manager
        shell: pwsh
        run: |
          dotnet publish .\Manager\ZktecoRelay.Manager.csproj `
            -c Release `
            -r ${{ matrix.runtime }} `
            --self-contained true `
            --no-restore `
            -p:Version=$env:APP_VERSION `
            -p:FileVersion=$env:APP_VERSION `
            -p:AssemblyVersion=$env:APP_VERSION `
            -p:PlatformTarget=${{ matrix.platform }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\artifacts\${{ matrix.runtime }}\manager

      - name: Add deployment files
        shell: pwsh
        run: |
          $root = ".\artifacts\${{ matrix.runtime }}"
          Copy-Item .\.env.example "$root\.env.example"
          Copy-Item .\README.md "$root\README.md"
          Copy-Item .\docs "$root\docs" -Recurse
          New-Item -ItemType Directory -Force -Path "$root\scripts" | Out-Null
          Copy-Item ".\scripts\*" "$root\scripts\" -Recurse
          New-Item -ItemType Directory -Force -Path "$root\dll" | Out-Null
          Copy-Item ".\dll\*" "$root\dll\" -Recurse

      - name: Verify executables
        shell: pwsh
        run: |
          $api = ".\artifacts\${{ matrix.runtime }}\api\ZktecoRelay.exe"
          $manager = ".\artifacts\${{ matrix.runtime }}\manager\ZktecoRelay.Manager.exe"
          if (-not (Test-Path $api)) { throw "API executable was not produced: $api" }
          if (-not (Test-Path $manager)) { throw "Manager executable was not produced: $manager" }
          $apiVersion = (Get-Item $api).VersionInfo.FileVersion
          $managerVersion = (Get-Item $manager).VersionInfo.FileVersion
          if (-not $apiVersion.StartsWith($env:APP_VERSION)) {
            throw "API file version '$apiVersion' does not match '$env:APP_VERSION'."
          }
          if (-not $managerVersion.StartsWith($env:APP_VERSION)) {
            throw "Manager file version '$managerVersion' does not match '$env:APP_VERSION'."
          }
          Get-Item $api, $manager | Select-Object FullName, Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $source = (Resolve-Path ".\artifacts\${{ matrix.runtime }}").Path
          $releaseDir = (New-Item -ItemType Directory -Force -Path ".\release").FullName
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $compiler `
            "/DAppVersion=$env:APP_VERSION" `
            "/DSourceDir=$source" `
            "/DArchitecture=${{ matrix.platform }}" `
            "/DOutputDir=$releaseDir" `
            ".\installer\ZktecoRelay.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          $installer = "$releaseDir\zkteco-relay-${{ matrix.runtime }}-setup.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not produced: $installer" }
          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash
          "$hash  $(Split-Path $installer -Leaf)" | Set-Content -Path "$installer.sha256" -Encoding ascii
          Get-Item $installer, "$installer.sha256" | Select-Object FullName, Length

      - name: Create portable archive and checksum
        shell: pwsh
        run: |
          $source = ".\artifacts\${{ matrix.runtime }}"
          $releaseDir = ".\release"
          $archive = "$releaseDir\zkteco-relay-${{ matrix.runtime }}.zip"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Compress-Archive -Path "$source\*" -DestinationPath $archive -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content -Path "$archive.sha256" -Encoding ascii
          Get-Item $archive, "$archive.sha256" | Select-Object FullName, Length

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: zkteco-relay-${{ matrix.runtime }}
          path: |
            .\release\zkteco-relay-${{ matrix.runtime }}-setup.exe
            .\release\zkteco-relay-${{ matrix.runtime }}-setup.exe.sha256
            .\release\zkteco-relay-${{ matrix.runtime }}.zip
            .\release\zkteco-relay-${{ matrix.runtime }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: zkteco-relay-win-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -maxdepth 2 -type f -print

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/zkteco-relay-win-x64-setup.exe
            release-assets/zkteco-relay-win-x64-setup.exe.sha256
            release-assets/zkteco-relay-win-x86-setup.exe
            release-assets/zkteco-relay-win-x86-setup.exe.sha256
            release-assets/zkteco-relay-win-x64.zip
            release-assets/zkteco-relay-win-x64.zip.sha256
            release-assets/zkteco-relay-win-x86.zip
            release-assets/zkteco-relay-win-x86.zip.sha256
